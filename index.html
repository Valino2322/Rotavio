<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rotavio Marketplace</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #6c757d;
            --border: #e9ecef;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
            --danger: #dc3545;
            --success: #28a745;
            --warning: #ffc107;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0;
            padding-bottom: 80px;
            min-height: 100vh;
        }
        
        /* ===== HEADER ===== */
        .header {
            background: var(--card-bg);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
        }
        
        .logo span { font-size: 22px; }
        
        .balance-badge {
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        /* ===== SEARCH ===== */
        .search-bar {
            padding: 10px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }
        
        .search-bar input {
            width: 100%;
            padding: 8px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        
        .search-bar input:focus { border-color: var(--primary); }
        
        /* ===== CATEGORIES ===== */
        .categories-section {
            padding: 10px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }
        
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0;
            scrollbar-width: none;
        }
        
        .categories-scroll::-webkit-scrollbar { display: none; }
        
        .category-chip {
            flex-shrink: 0;
            padding: 6px 16px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            color: var(--text-secondary);
        }
        
        .category-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .category-chip:active { transform: scale(0.95); }
        
        /* ===== PRODUCTS ===== */
        .products-container { padding: 10px 16px; }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .product-card:active { transform: scale(0.97); }
        
        .product-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #e8e8e8, #d0d0d0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            position: relative;
            overflow: hidden;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .product-image .favorite-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            padding: 3px;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        .product-info { padding: 8px 10px 10px; }
        
        .product-title {
            font-size: 12px;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
            min-height: 32px;
        }
        
        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 2px;
        }
        
        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            font-size: 10px;
            color: var(--text-secondary);
        }
        
        .product-seller {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 10px;
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
            z-index: 200;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 9px;
            cursor: pointer;
            padding: 2px 8px;
            transition: color 0.2s;
            position: relative;
            gap: 1px;
        }
        
        .nav-item.active { color: var(--primary); }
        .nav-item .icon { font-size: 20px; }
        
        .nav-item .badge {
            position: absolute;
            top: -4px;
            right: 0px;
            background: var(--danger);
            color: white;
            font-size: 8px;
            border-radius: 50%;
            min-width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            padding: 0 4px;
        }
        
        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--card-bg);
            z-index: 1000;
            overflow-y: auto;
            padding: 0;
            padding-bottom: 80px;
        }
        
        .modal.active {
            display: block;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 10;
        }
        
        .modal-back {
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text);
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        
        .modal-body { padding: 12px 16px; }
        
        .modal-image {
            width: 100%;
            height: 200px;
            background: var(--bg);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        
        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        
        .modal-price {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 6px;
        }
        
        .modal-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .modal-description {
            margin-bottom: 12px;
            line-height: 1.5;
            font-size: 13px;
        }
        
        .modal-characteristics {
            background: var(--bg);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        
        .modal-characteristics .char-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        
        .modal-characteristics .char-item:last-child { border-bottom: none; }
        
        .modal-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        
        .modal-actions .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            min-width: 70px;
        }
        
        .modal-actions .btn:active { opacity: 0.7; }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 2px solid var(--border);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .modal-seller {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        
        /* ===== CHAT ===== */
        .chat-container {
            padding: 10px 16px;
            max-height: 400px;
            overflow-y: auto;
            background: var(--bg);
            border-radius: var(--radius);
            margin-bottom: 10px;
        }
        
        .chat-message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .chat-message.sent {
            background: var(--primary);
            color: white;
            margin-left: auto;
        }
        
        .chat-message.received {
            background: var(--card-bg);
            border: 1px solid var(--border);
        }
        
        .chat-message .sender {
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .chat-message .time {
            font-size: 9px;
            opacity: 0.7;
            margin-top: 4px;
        }
        
        .chat-input {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            outline: none;
        }
        
        .chat-input input:focus { border-color: var(--primary); }
        
        .chat-input button {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 6px; }
        
        /* ===== PROFILE ===== */
        .profile-section { padding: 12px 16px; }
        
        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 8px;
            color: white;
        }
        
        .profile-name { text-align: center; font-size: 20px; font-weight: 700; }
        .profile-phone { text-align: center; color: var(--text-secondary); margin-bottom: 16px; font-size: 13px; }
        
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .stat-card {
            background: var(--bg);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card .number { font-size: 18px; font-weight: 700; color: var(--primary); }
        .stat-card .label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        
        /* ===== ORDERS ===== */
        .order-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            margin-bottom: 8px;
            box-shadow: var(--shadow);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .order-id { font-weight: 600; font-size: 13px; }
        
        .order-status {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 10px;
        }
        
        .order-status.pending { background: #fff3cd; color: #856404; }
        .order-status.completed { background: #d4edda; color: #155724; }
        .order-status.cancelled { background: #f8d7da; color: #721c24; }
        
        .order-details { font-size: 12px; color: var(--text-secondary); }
        .order-details .amount { font-weight: 600; color: var(--text); }
        
        .order-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        
        .order-actions .btn-sm {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .order-actions .btn-sm:active { opacity: 0.7; }
        .btn-sm-success { background: var(--success); color: white; }
        .btn-sm-danger { background: var(--danger); color: white; }
        .btn-sm-primary { background: var(--primary); color: white; }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            z-index: 2000;
            animation: slideDown 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            max-width: 90%;
        }
        
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: #17a2b8; }
        
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        /* ===== LOADING ===== */
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        
        .loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .products-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .modal-image { height: 180px; }
            .modal-actions .btn { font-size: 12px; padding: 10px; }
        }
        
        @media (min-width: 768px) {
            .products-grid { grid-template-columns: repeat(3, 1fr); }
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="logo"><span>🛍️</span> Rotavio</div>
        <div class="balance-badge" id="balanceDisplay">💰 0 ₽</div>
    </div>
    
    <!-- SEARCH -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Поиск товаров..." oninput="searchProducts(this.value)">
    </div>
    
    <!-- CATEGORIES -->
    <div class="categories-section">
        <div class="categories-scroll" id="categoriesContainer"></div>
    </div>
    
    <!-- PRODUCTS -->
    <div class="products-container">
        <div id="productsContainer">
            <div class="loading"><div class="spinner"></div>Загрузка товаров...</div>
        </div>
    </div>
    
    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <button class="nav-item active" data-view="catalog" onclick="navigateTo('catalog')">
            <span class="icon">🛍️</span> Каталог
        </button>
        <button class="nav-item" data-view="favorites" onclick="navigateTo('favorites')">
            <span class="icon">⭐</span> Избранное
            <span class="badge" id="favoritesBadge" style="display:none;">0</span>
        </button>
        <button class="nav-item" data-view="cart" onclick="navigateTo('cart')">
            <span class="icon">🛒</span> Корзина
            <span class="badge" id="cartBadge" style="display:none;">0</span>
        </button>
        <button class="nav-item" data-view="orders" onclick="navigateTo('orders')">
            <span class="icon">📦</span> Заказы
        </button>
        <button class="nav-item" data-view="profile" onclick="navigateTo('profile')">
            <span class="icon">👤</span> Профиль
        </button>
    </div>
    
    <!-- PRODUCT MODAL -->
    <div class="modal" id="productModal">
        <div class="modal-header">
            <button class="modal-back" onclick="closeModal()">← Назад</button>
        </div>
        <div class="modal-body">
            <div class="modal-image" id="modalImage">📦</div>
            <div class="modal-title" id="modalTitle">Название</div>
            <div class="modal-price" id="modalPrice">0 ₽</div>
            <div class="modal-rating" id="modalRating">⭐ 0.0 (0 отзывов)</div>
            <div class="modal-description" id="modalDescription">Описание</div>
            <div class="modal-characteristics" id="modalCharacteristics"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="modalBuyBtn" onclick="buyProduct()">🛒 Купить</button>
                <button class="btn btn-secondary" id="modalFavoriteBtn" onclick="toggleFavorite()">🤍</button>
                <button class="btn btn-secondary" id="modalCartBtn" onclick="addToCart()">🛍️ В корзину</button>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modalChatBtn" onclick="openChat()">💬 Чат с продавцом</button>
            </div>
            <div class="modal-seller">👤 <span id="modalSeller">Продавец: неизвестен</span></div>
        </div>
    </div>
    
    <!-- CHAT MODAL -->
    <div class="modal" id="chatModal">
        <div class="modal-header">
            <button class="modal-back" onclick="closeChat()">← Назад</button>
            <span style="font-weight:600; margin-left:8px;" id="chatTitle">Чат по заказу</span>
        </div>
        <div class="modal-body">
            <div class="chat-container" id="chatMessages">
                <div style="text-align:center; color:var(--text-secondary); padding:20px;">Загрузка сообщений...</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>
    
    <script>
        // ===== TELEGRAM =====
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // ===== STATE =====
        let state = {
            products: [],
            favorites: [],
            cart: {},
            orders: [],
            balance: 0,
            user: {},
            currentView: 'catalog',
            currentProduct: null,
            currentCategory: 'all',
            currentOrderId: null
        };
        
        // ===== CATEGORIES =====
        const CATEGORIES = {
            'all': '📦 Все',
            'electronics': '📱 Электроника',
            'clothing': '👕 Одежда',
            'home': '🏠 Дом',
            'auto': '🚗 Авто',
            'books': '📚 Книги',
            'games': '🎮 Игры',
            'sports': '⚽ Спорт',
            'kids': '🧸 Детское',
            'other': '📦 Другое'
        };
        
        // ===== INIT =====
        function init() {
            loadData();
            renderCategories();
            
            tg.onEvent('data', function(data) {
                try {
                    const parsed = JSON.parse(data);
                    if (parsed.products) {
                        state.products = parsed.products;
                        state.balance = parsed.balance || 0;
                        state.favorites = parsed.favorites || [];
                        state.cart = parsed.cart || {};
                        state.orders = parsed.orders || [];
                        state.user = parsed.user || {};
                        updateUI();
                        renderProducts(getFilteredProducts());
                    }
                } catch (e) {
                    console.error('Ошибка обработки данных:', e);
                }
            });
        }
        
        // ===== LOAD DATA =====
        function loadData() {
            tg.sendData(JSON.stringify({ action: 'get_data' }));
        }
        
        // ===== UPDATE UI =====
        function updateUI() {
            document.getElementById('balanceDisplay').textContent = `💰 ${state.balance} ₽`;
            updateBadges();
        }
        
        function updateBadges() {
            const favBadge = document.getElementById('favoritesBadge');
            const favCount = state.favorites.length;
            favBadge.style.display = favCount > 0 ? 'flex' : 'none';
            favBadge.textContent = favCount;
            
            const cartBadge = document.getElementById('cartBadge');
            const cartCount = Object.keys(state.cart).length;
            cartBadge.style.display = cartCount > 0 ? 'flex' : 'none';
            cartBadge.textContent = cartCount;
        }
        
        // ===== RENDER CATEGORIES =====
        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';
            Object.entries(CATEGORIES).forEach(([key, name]) => {
                const chip = document.createElement('button');
                chip.className = 'category-chip' + (key === state.currentCategory ? ' active' : '');
                chip.textContent = name;
                chip.dataset.category = key;
                chip.onclick = () => filterByCategory(key);
                container.appendChild(chip);
            });
        }
        
        // ===== FILTER PRODUCTS =====
        function getFilteredProducts() {
            let products = state.products;
            if (state.currentCategory !== 'all') {
                products = products.filter(p => p.category === state.currentCategory);
            }
            return products;
        }
        
        function filterByCategory(category) {
            state.currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(el => {
                el.classList.toggle('active', el.dataset.category === category);
            });
            renderProducts(getFilteredProducts());
        }
        
        function searchProducts(query) {
            const filtered = state.products.filter(p => 
                p.title.toLowerCase().includes(query.toLowerCase()) ||
                p.description.toLowerCase().includes(query.toLowerCase())
            );
            renderProducts(filtered);
        }
        
        // ===== RENDER PRODUCTS =====
        function renderProducts(products) {
            const container = document.getElementById('productsContainer');
            
            if (!products || products.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📭</span>
                        <h3>Товаров не найдено</h3>
                        <p>Попробуйте изменить фильтры или поиск</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="products-grid">
                    ${products.map(p => `
                        <div class="product-card" onclick="openProduct(${p.id})">
                            <div class="product-image">
                                ${p.photos && p.photos[0] ? `<img src="${p.photos[0]}" alt="${p.title}">` : '📦'}
                                ${state.favorites.includes(p.id) ? '<span class="favorite-badge">❤️</span>' : ''}
                            </div>
                            <div class="product-info">
                                <div class="product-title">${p.title}</div>
                                <div class="product-price">${p.price} ₽</div>
                                <div class="product-meta">
                                    <span class="product-rating">⭐ ${p.rating || 0}</span>
                                    <span>👁️ ${p.characteristics?.Просмотров || 0}</span>
                                </div>
                                <div class="product-seller">👤 ${p.seller || 'Продавец'}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // ===== NAVIGATE =====
        function navigateTo(view) {
            state.currentView = view;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.view === view);
            });
            
            switch(view) {
                case 'catalog': renderProducts(getFilteredProducts()); break;
                case 'favorites':
                    renderProducts(state.products.filter(p => state.favorites.includes(p.id)));
                    break;
                case 'cart':
                    renderProducts(state.products.filter(p => state.cart[p.id]));
                    break;
                case 'orders': renderOrders(); break;
                case 'profile': renderProfile(); break;
            }
        }
        
        // ===== RENDER ORDERS =====
        function renderOrders() {
            const container = document.getElementById('productsContainer');
            const userOrders = state.orders || [];
            
            if (userOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📦</span>
                        <h3>У вас пока нет заказов</h3>
                        <p>Начните покупать товары прямо сейчас!</p>
                    </div>
                `;
                return;
            }
            
            // Группируем по order_id
            const grouped = {};
            userOrders.forEach(o => {
                const id = o.order_id || o.id;
                if (!grouped[id]) grouped[id] = [];
                grouped[id].push(o);
            });
            
            container.innerHTML = Object.entries(grouped).map(([orderId, orders]) => {
                const first = orders[0];
                const statusMap = { 'pending': '⏳ Ожидает', 'completed': '✅ Завершен', 'cancelled': '❌ Отменен' };
                const statusClass = first.status || 'pending';
                const total = orders.reduce((sum, o) => sum + (o.amount || 0), 0);
                
                return `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="order-id">📦 Заказ #${orderId}</span>
                            <span class="order-status ${statusClass}">${statusMap[statusClass] || statusClass}</span>
                        </div>
                        <div class="order-details">
                            ${orders.map(o => `
                                <div>• ${o.product_title || 'Товар'} — ${o.amount || 0} ₽</div>
                            `).join('')}
                            <div class="amount">💰 Итого: ${total} ₽</div>
                            <div>📅 ${first.created_at ? new Date(first.created_at).toLocaleDateString() : ''}</div>
                        </div>
                        ${first.status === 'pending' && first.buyer_id === tg.initDataUnsafe?.user?.id ? `
                            <div class="order-actions">
                                <button class="btn-sm btn-sm-success" onclick="confirmOrder(${orderId})">✅ Подтвердить</button>
                                <button class="btn-sm btn-sm-danger" onclick="cancelOrder(${orderId})">❌ Отменить</button>
                                <button class="btn-sm btn-sm-primary" onclick="openChatForOrder(${orderId})">💬 Чат</button>
                            </div>
                        ` : ''}
                        ${first.status === 'pending' && first.seller_id === tg.initDataUnsafe?.user?.id ? `
                            <div class="order-actions">
                                <button class="btn-sm btn-sm-primary" onclick="openChatForOrder(${orderId})">💬 Чат</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }
        
        // ===== RENDER PROFILE =====
        function renderProfile() {
            const container = document.getElementById('productsContainer');
            const user = state.user;
            const registered = user.registered ? new Date(user.registered).toLocaleDateString() : 'Неизвестно';
            
            container.innerHTML = `
                <div class="profile-section">
                    <div class="profile-avatar">👤</div>
                    <div class="profile-name">${user.name || 'Пользователь'}</div>
                    <div class="profile-phone">📱 ${user.phone || 'Не указан'}</div>
                    
                    <div class="profile-stats">
                        <div class="stat-card"><div class="number">${state.products.length}</div><div class="label">Товаров</div></div>
                        <div class="stat-card"><div class="number">${state.favorites.length}</div><div class="label">Избранное</div></div>
                        <div class="stat-card"><div class="number">${Object.keys(state.cart).length}</div><div class="label">В корзине</div></div>
                    </div>
                    
                    <div class="stat-card" style="margin-bottom:10px; padding:12px;">
                        <div class="number" style="font-size:24px;">${state.balance} ₽</div>
                        <div class="label">💰 Баланс</div>
                    </div>
                    
                    <div style="display:flex; gap:8px; margin-bottom:10px;">
                        <button class="btn btn-primary" style="flex:1;" onclick="showAddBalance()">💳 Пополнить</button>
                        <button class="btn btn-secondary" style="flex:1;" onclick="loadData()">🔄 Обновить</button>
                    </div>
                    
                    <div style="text-align:center; color:var(--text-secondary); font-size:11px;">
                        📅 Регистрация: ${registered}
                        ${user.rating ? `<br>⭐ Рейтинг: ${user.rating}` : ''}
                    </div>
                </div>
            `;
        }
        
        // ===== OPEN PRODUCT =====
        function openProduct(productId) {
            const product = state.products.find(p => p.id === productId);
            if (!product) return;
            
            state.currentProduct = product;
            
            document.getElementById('modalImage').innerHTML = 
                product.photos && product.photos[0] ? `<img src="${product.photos[0]}" alt="${product.title}">` : '📦';
            document.getElementById('modalTitle').textContent = product.title;
            document.getElementById('modalPrice').textContent = `${product.price} ₽`;
            document.getElementById('modalRating').textContent = `⭐ ${product.rating || 0} (${product.reviews_count || 0} отзывов)`;
            document.getElementById('modalDescription').textContent = product.description || 'Описание отсутствует';
            document.getElementById('modalSeller').textContent = `Продавец: ${product.seller || 'неизвестен'}`;
            
            const charContainer = document.getElementById('modalCharacteristics');
            if (product.characteristics && Object.keys(product.characteristics).length > 0) {
                charContainer.innerHTML = Object.entries(product.characteristics)
                    .map(([key, value]) => `<div class="char-item"><span>${key}</span><span>${value}</span></div>`)
                    .join('');
                charContainer.style.display = 'block';
            } else {
                charContainer.style.display = 'none';
            }
            
            document.getElementById('modalFavoriteBtn').textContent = state.favorites.includes(productId) ? '❤️' : '🤍';
            document.getElementById('modalCartBtn').textContent = state.cart[productId] ? '❌ Из корзины' : '🛍️ В корзину';
            document.getElementById('modalChatBtn').style.display = product.seller_id ? 'block' : 'none';
            
            document.getElementById('productModal').classList.add('active');
        }
        
        function closeModal() { document.getElementById('productModal').classList.remove('active'); }
        
        // ===== PRODUCT ACTIONS =====
        function buyProduct() {
            if (!state.currentProduct) return;
            const product = state.currentProduct;
            
            if (state.balance < product.price) {
                showToast(`❌ Недостаточно средств!\nНужно: ${product.price} ₽`, 'error');
                return;
            }
            
            tg.sendData(JSON.stringify({ action: 'buy', product_id: product.id }));
            showToast(`✅ Товар "${product.title}" куплен!`, 'success');
            closeModal();
            setTimeout(loadData, 500);
        }
        
        function toggleFavorite() {
            if (!state.currentProduct) return;
            const productId = state.currentProduct.id;
            const isFavorite = state.favorites.includes(productId);
            
            if (isFavorite) state.favorites = state.favorites.filter(id => id !== productId);
            else state.favorites.push(productId);
            
            tg.sendData(JSON.stringify({ action: 'favorite', product_id: productId, favorite: !isFavorite }));
            document.getElementById('modalFavoriteBtn').textContent = isFavorite ? '🤍' : '❤️';
            updateBadges();
            showToast(isFavorite ? 'Удалено из избранного' : 'Добавлено в избранное', 'info');
        }
        
        function addToCart() {
            if (!state.currentProduct) return;
            const productId = state.currentProduct.id;
            const inCart = !!state.cart[productId];
            
            if (inCart) delete state.cart[productId];
            else state.cart[productId] = 1;
            
            tg.sendData(JSON.stringify({ action: 'cart', product_id: productId, in_cart: !inCart }));
            document.getElementById('modalCartBtn').textContent = inCart ? '🛍️ В корзину' : '❌ Из корзины';
            updateBadges();
            showToast(inCart ? 'Удалено из корзины' : 'Добавлено в корзину', 'info');
        }
        
        function openChat() {
            if (!state.currentProduct) return;
            // Проверяем, есть ли заказ с этим товаром
            const order = state.orders.find(o => o.product_id === state.currentProduct.id);
            if (order) {
                openChatForOrder(order.order_id || order.id);
            } else {
                showToast('💬 Сначала оформите заказ на этот товар', 'info');
            }
        }
        
        // ===== CHAT =====
        function openChatForOrder(orderId) {
            state.currentOrderId = orderId;
            document.getElementById('chatTitle').textContent = `💬 Чат по заказу #${orderId}`;
            document.getElementById('chatModal').classList.add('active');
            loadChatHistory(orderId);
        }
        
        function closeChat() { document.getElementById('chatModal').classList.remove('active'); }
        
        function loadChatHistory(orderId) {
            tg.sendData(JSON.stringify({ action: 'get_chat_history', order_id: orderId }));
            
            tg.onEvent('data', function(data) {
                try {
                    const parsed = JSON.parse(data);
                    if (parsed.messages) {
                        renderChatMessages(parsed.messages);
                    }
                } catch (e) {
                    console.error('Ошибка загрузки чата:', e);
                }
            });
        }
        
        function renderChatMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!messages || messages.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); padding:20px;">💬 Начните общение!</div>';
                return;
            }
            
            const userId = tg.initDataUnsafe?.user?.id;
            container.innerHTML = messages.map(msg => `
                <div class="chat-message ${msg.sender_id === userId ? 'sent' : 'received'}">
                    <div class="sender">${msg.sender_name || 'Пользователь'}</div>
                    ${msg.text}
                    <div class="time">${msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !state.currentOrderId) return;
            
            tg.sendData(JSON.stringify({
                action: 'send_message',
                order_id: state.currentOrderId,
                message: text
            }));
            
            input.value = '';
            showToast('✅ Сообщение отправлено!', 'success');
            
            // Обновляем чат
            setTimeout(() => loadChatHistory(state.currentOrderId), 300);
        }
        
        // ===== ORDER ACTIONS =====
        function confirmOrder(orderId) {
            tg.sendData(JSON.stringify({ action: 'confirm_order', order_id: orderId }));
            showToast('✅ Заказ подтвержден!', 'success');
            setTimeout(loadData, 500);
        }
        
        function cancelOrder(orderId) {
            tg.sendData(JSON.stringify({ action: 'cancel_order', order_id: orderId }));
            showToast('❌ Заказ отменен', 'error');
            setTimeout(loadData, 500);
        }
        
        function checkout() {
            if (Object.keys(state.cart).length === 0) {
                showToast('❌ Корзина пуста', 'error');
                return;
            }
            tg.sendData(JSON.stringify({ action: 'checkout' }));
            showToast('✅ Заказ оформлен!', 'success');
            setTimeout(loadData, 500);
            navigateTo('orders');
        }
        
        // ===== BALANCE =====
        function showAddBalance() {
            const amount = prompt('💳 Введите сумму для пополнения (в рублях):', '1000');
            if (amount && !isNaN(amount) && parseInt(amount) > 0) {
                tg.sendData(JSON.stringify({ action: 'add_balance', amount: parseInt(amount) }));
                showToast(`✅ Баланс пополнен на ${amount} ₽`, 'success');
                setTimeout(loadData, 500);
            }
        }
        
        // ===== TOAST =====
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // ===== START =====
        init();
    </script>
</body>
</html>
